name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 쉼 데이터 검증
        run: node scripts/validate-data.mjs
      - name: 웹폰트 글자 커버리지 검증
        run: node scripts/check-font-coverage.mjs
      - name: 한글 로마자 변환 검증
        run: node scripts/check-roman.mjs
