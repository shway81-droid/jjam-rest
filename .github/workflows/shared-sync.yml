name: 공통 파일 동기화 확인

# 짬짬이 다섯 사이트는 저장소가 따로지만 웹폰트와 헤더의 자매 사이트 바로가기는
# 다섯 곳에서 같아야 한다. 한쪽만 고치면 사이트마다 글씨체나 바로가기가 조용히 갈라진다.
#
# 이 워크플로는 상류(jjam@main)와 다른 파일이 있는지 주기적으로 확인한다.
#
# PR에는 걸지 않는다 — 상류가 먼저 바뀌면 관계없는 PR까지 막히기 때문이다.
# 대신 예약 실행·수동 실행으로 이탈을 드러낸다. 맞추는 것은 `node scripts/sync-shared.mjs` 한 줄.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 20 * * *'     # 매일 05:30 KST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 상류(jjam)와 공통 파일 비교
        run: node scripts/sync-shared.mjs --check
