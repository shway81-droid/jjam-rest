name: 공통 파일 동기화 확인

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 상류(jjam)와 공통 파일 비교
        run: node scripts/sync-shared.mjs --check
