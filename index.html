<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짬짬이 쉼 — 수업 전 1~5분, 반을 차분하게</title>
  <meta name="description" content="체육·점심 직후 들뜬 반을 몇 분 만에 가라앉히는 전자칠판용 쉼 활동. 유형과 시간을 고르면 화면이 호흡·소리·상상을 스스로 진행합니다. 설치·로그인 없음.">
  <meta name="theme-color" content="#0E7C86">
  <meta property="og:title" content="짬짬이 쉼">
  <meta property="og:description" content="들뜬 반을 몇 분 만에 가라앉혀요. 교사도 같이 쉬어요.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <!-- 폰트는 css/style.css의 @font-face로 자가 호스팅한다(외부 CDN 없음 → 오프라인 동작). -->
  <link rel="preload" href="assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#" id="brand-home">
      <span class="brand-icon"><img class="ic" src="favicon.svg" alt="" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">짬짬이 쉼</span>
        <span class="brand-sub">수업 전 1~5분, 반을 차분하게</span>
      </span>
    </a>
    <div class="topbar-actions">
      <!-- 음소거 토글 — 진행 화면 안이 아니라 상단바에 둔다 (진행 화면 안 버튼은 일시정지 하나뿐). -->
      <button id="btn-mute" class="icon-btn" type="button" aria-label="소리 켜고 끄기" aria-pressed="false">
        <svg class="ic-line" viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5v5h3.2L12 19V5L7.2 9.5H4z"/><path class="spk-wave" d="M15.5 9c1.6 1.7 1.6 4.3 0 6M18 6.8c2.8 2.9 2.8 7.5 0 10.4"/><path class="spk-x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
      </button>
      <!-- 자매 사이트 바로가기 — 내용·스타일은 shared/jjam-switcher.js 안에 있다.
           진행 중(screen-play)에는 js/app.js 가 숨긴다 — 쉼 도중에 눌러 나가지 않도록. -->
      <div class="jjam-switch" data-site="rest" id="site-switch"></div>
    </div>
  </header>

  <main id="app">
    <!-- 1. 홈: 쉼 유형 선택 -->
    <section id="screen-home" class="screen">
      <div class="cta-strip">
        <p class="cta-copy"><b>체육·점심 직후 들뜬 반,</b> 시작을 누르면 화면이 끝까지 <b>스스로</b> 진행해요</p>
      </div>

      <div class="type-grid" id="type-grid" aria-label="쉼 유형 선택"></div>

      <section class="fav-section" id="recent-section" hidden>
        <h2>🕓 최근 사용</h2>
        <div class="session-chip-row" id="recent-row"></div>
      </section>

      <footer class="site-footer">
        <p>시작 버튼 이후, 선생님은 아무것도 누르지 않아도 돼요.</p>
      </footer>
    </section>

    <!-- 2. 시간 선택 -->
    <section id="screen-setup" class="screen" hidden>
      <h1 class="setup-title" id="setup-title"></h1>

      <div class="setup-card">
        <div class="picked-session">
          <p class="picked-label">오늘의 쉼</p>
          <p class="picked-title" id="picked-title"></p>
          <button class="btn btn-ghost btn-sm" id="btn-swap" type="button">🔄 다른 편으로</button>
        </div>

        <div class="setup-group">
          <h2>시간</h2>
          <div class="option-row" id="opt-duration" role="radiogroup" aria-label="시간 선택"></div>
        </div>

        <!-- 목소리 — 기기에 한국어 목소리가 있을 때만 나타난다.
             없는 기기에서 보여 주면 눌러도 아무 일이 없다 (js/app.js renderSetup). -->
        <div class="setup-group" id="voice-group" hidden>
          <h2>목소리</h2>
          <div class="option-row" id="opt-voice" role="radiogroup" aria-label="문구 읽어주기 선택"></div>
          <!-- 어떤 목소리로 읽는지. 기기에 한국어 목소리가 둘 이상이면 드롭다운으로
               고르고, 하나뿐이면 이름만 보여 준다 — 어느 쪽이든 들어볼 수는 있다. -->
          <div class="voice-pick" id="voice-pick" hidden>
            <select id="voice-select" aria-label="목소리 고르기" hidden></select>
            <span class="voice-name" id="voice-name" hidden></span>
            <button class="btn btn-ghost btn-sm" id="btn-voice-try" type="button">미리 들어보기</button>
            <p class="voice-tip" id="voice-tip" hidden></p>
          </div>
          <!-- 신경망 목소리 받기 — 아직 안 받았을 때만 나타난다.
               받고 나면 위 고르기 목록의 한 항목이 된다 (js/app.js). -->
          <div class="voice-get" id="voice-get" hidden>
            <button class="btn btn-ghost btn-sm" id="btn-voice-get" type="button">또렷한 목소리 받기</button>
            <p class="voice-get-note" id="voice-get-note"></p>
          </div>
        </div>
      </div>

      <div class="setup-actions">
        <button class="btn btn-ghost" id="btn-setup-back" type="button">← 유형 다시 고르기</button>
        <button class="btn btn-primary btn-big" id="btn-start" type="button">▶ 시작</button>
      </div>
    </section>

    <!-- 3. 진행 — 전체 화면급 단순함. 아무것도 누르지 않아도 끝까지 진행되고,
         구석의 두 버튼은 필요할 때만 쓰는 비상구다(교내 방송·문구 넘기기). -->
    <section id="screen-play" class="screen play" hidden>
      <div class="play-anim" id="play-anim" aria-hidden="true"></div>
      <p class="play-text" id="play-text"></p>
      <div class="play-corner">
        <span class="play-remain" id="play-remain" aria-label="남은 시간">0:00</span>
        <!-- 일시정지보다 한 단계 약하게 보인다 — 기본은 여전히 "누르지 않는 것". -->
        <!-- 기호는 웹폰트 서브셋에 있는 것만 쓴다 — 흔한 다음트랙 기호(U+23ED)는
             서브셋에 없어 그 글자만 시스템 폰트로 떨어진다. 시작·계속의 ▶ 와도
             헷갈리지 않는다. -->
        <button class="btn-pause btn-skip" id="btn-skip" type="button">» 다음 단계</button>
        <button class="btn-pause" id="btn-pause" type="button">⏸ 일시정지</button>
      </div>
    </section>

    <!-- 4. 마무리 -->
    <section id="screen-done" class="screen done" hidden>
      <div class="done-emoji" aria-hidden="true">🌿</div>
      <h1 id="done-text"></h1>
      <div class="done-actions">
        <button class="btn btn-primary btn-big" id="btn-again" type="button">🔄 한 번 더</button>
        <button class="btn btn-ghost btn-big" id="btn-done-home" type="button">🏠 처음으로</button>
      </div>
    </section>
  </main>

  <script src="js/sound.js"></script>
  <!-- 신경망 목소리(선택 설치). 받기 전에는 아무 일도 하지 않고,
       받은 뒤에는 speech.js 가 브라우저 목소리 대신 이쪽으로 읽는다. -->
  <script src="js/hangul-roman.js"></script>
  <script src="js/neural-voice.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
  <script src="shared/jjam-switcher.js" defer></script>
</body>
</html>
